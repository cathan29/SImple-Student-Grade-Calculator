<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎓 Student Grade Calculator</h1>
        <p>Enter your exam scores to calculate your final grade.</p>
        <form id="grade-form">
            <div class="form-group">
                <label for="exam1">Exam 1 Score:</label>
                <input type="number" id="exam1" placeholder="Enter score (0-100)" required min="0" max="100">
            </div>
            <div class="form-group">
                <label for="exam2">Exam 2 Score:</label>
                <input type="number" id="exam2" placeholder="Enter score (0-100)" required min="0" max="100">
            </div>
            <div class="form-group">
                <label for="exam3">Exam 3 Score:</label>
                <input type="number" id="exam3" placeholder="Enter score (0-100)" required min="0" max="100">
            </div>
            <button type="submit">Calculate Grade</button>
        </form>
    </div>


    <div id="grade-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🎉 Final Grade</h2>
            <p id="grade-output"></p>
            <button id="restart-button">Restart</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
